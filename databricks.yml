bundle:
  name: sat-poc

variables:
  analysis_catalog:
    default: "test"
  analysis_schema:
    default: "sat_poc"
  enable_account_checks:
    default: "false"
  # sat_repo_root is implicitly the bundle root (this repo).
  # Notebooks are referenced via relative paths in job definitions
  # so that `bundle deploy` handles deployment automatically.

sync:
  include:
    - lib/*.whl

include:
  - deployment/bundle/resources/*.yml

targets:
  dev:
    workspace:
      host: "https://adb-7405608270137042.2.azuredatabricks.net"
      root_path: /Applications/SAT
    run_as:
      service_principal_name: a4742461-a54f-46c1-a665-64855289d3f9
    permissions:
      - user_name: dinesh.kamalakkannan@databricks.com
        level: CAN_MANAGE
      - service_principal_name: a4742461-a54f-46c1-a665-64855289d3f9
        level: CAN_MANAGE
        
